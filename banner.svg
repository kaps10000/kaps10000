<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF2D2D"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#2979FF"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00B0FF"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4081"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF9100"/>
    </linearGradient>
    <style>
      @keyframes sparkle1 { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes sparkle2 { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
      .spark1 { animation: sparkle1 1.5s ease-in-out infinite; }
      .spark2 { animation: sparkle2 1.8s ease-in-out infinite; }
      .spark3 { animation: sparkle1 2.1s ease-in-out infinite; }
      .spark4 { animation: sparkle2 1.3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background dots / sparkles -->
  <circle cx="80" cy="40" r="2.5" fill="#FFD700" class="spark1"/>
  <circle cx="720" cy="35" r="2" fill="#00E5FF" class="spark2"/>
  <circle cx="150" cy="200" r="2" fill="#FF4081" class="spark3"/>
  <circle cx="650" cy="210" r="2.5" fill="#00E676" class="spark4"/>
  <circle cx="50" cy="130" r="1.8" fill="#FF6B00" class="spark2"/>
  <circle cx="750" cy="120" r="1.8" fill="#FFD700" class="spark1"/>
  <circle cx="200" cy="25" r="1.5" fill="#2979FF" class="spark4"/>
  <circle cx="600" cy="230" r="1.5" fill="#FF9100" class="spark3"/>
  <circle cx="350" cy="15" r="2" fill="#FF2D2D" class="spark1"/>
  <circle cx="450" cy="240" r="2" fill="#00B0FF" class="spark2"/>
  <circle cx="110" cy="90" r="1.5" fill="#F59E0B" class="spark3"/>
  <circle cx="690" cy="80" r="1.5" fill="#FF4081" class="spark4"/>
  <circle cx="250" cy="230" r="2" fill="#FFD700" class="spark2"/>
  <circle cx="550" cy="20" r="2" fill="#00E676" class="spark1"/>

  <!-- K -->
  <text x="135" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g1)" letter-spacing="2">K</text>

  <!-- A -->
  <text x="230" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g2)" letter-spacing="2">A</text>

  <!-- P -->
  <text x="330" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g3)" letter-spacing="2">P</text>

  <!-- S -->
  <text x="420" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g4)" letter-spacing="2">S</text>

  <!-- 1 -->
  <text x="510" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g5)" letter-spacing="2">1</text>

  <!-- 0 -->
  <text x="570" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g6)" letter-spacing="2">0</text>

  <!-- 0 -->
  <text x="650" y="160" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="url(#g7)" letter-spacing="2">0</text>

  <!-- Diagonal slash lines on each letter for that cut style -->
  <line x1="130" y1="30" x2="200" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="230" y1="30" x2="300" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="330" y1="30" x2="400" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="420" y1="30" x2="490" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="510" y1="30" x2="560" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="575" y1="30" x2="640" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
  <line x1="650" y1="30" x2="720" y2="170" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
</svg>
