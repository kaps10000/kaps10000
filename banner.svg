<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="50%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle glow behind text -->
  <text x="400" y="120" font-family="'Courier New', monospace" font-size="100" font-weight="900"
        fill="url(#fire)" text-anchor="middle" filter="url(#softGlow)" opacity="0.3">
    KAPS100
  </text>

  <!-- Main text -->
  <text x="400" y="120" font-family="'Courier New', monospace" font-size="100" font-weight="900"
        fill="url(#fire)" text-anchor="middle" filter="url(#glow)" letter-spacing="8">
    KAPS100
  </text>

  <!-- Underline accent -->
  <rect x="150" y="145" width="500" height="3" rx="2" fill="url(#fire)" opacity="0.6"/>

  <!-- Decorative dots -->
  <circle cx="140" cy="146" r="4" fill="#FF6B00" opacity="0.8"/>
  <circle cx="660" cy="146" r="4" fill="#F59E0B" opacity="0.8"/>
</svg>
